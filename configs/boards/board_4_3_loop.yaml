# 4 columns x 3 rows. Array rows run from top to bottom.
# World origin is the board's bottom-left corner; +X right, +Y up.
# The drawing supplies the centerline layout. Radius/width are editable defaults.
schema_version: 1
name: Loop
units: mm
source: references/board_4_3_loop.png
grid_size_mm: 240
line:
  default_width_mm: 20
  default_turn_radius_mm: 80
columns:
  placement: grid_intersections
  display_diameter_mm: 20       # Visualization only, NOT collision geometry
  collision_reference: center
tiles:
  - [turn_se, straight_ew, straight_ew, turn_sw]
  - [straight_ns, empty, empty, straight_ns]
  - [turn_ne, straight_ew, straight_ew, turn_nw]
# Override a corner with: {type: turn_se, radius_mm: 60}
